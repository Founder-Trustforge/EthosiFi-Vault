[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true            # VaultFactory.createVault hits "stack too deep" without it
optimizer = true
optimizer_runs = 200
evm_version = "cancun"   # erc7579-implementation uses cancun features

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
